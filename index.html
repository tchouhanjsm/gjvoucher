<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Cash Payment Vouchers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="lock hidden">
  <form id="loginForm" class="card lock-card" autocomplete="on">
    <h1 id="loginTitle">Cash Vouchers</h1>
    <p class="muted">Sign in to continue</p>
    <input id="lUrl" type="url" placeholder="Server URL (https://script.google.com/…)" class="hidden">
    <input id="lEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input id="lPin" type="password" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="current-password" required>
    <button class="btn primary" id="lBtn">Sign in</button>
    <p id="lErr" class="error"></p>
  </form>
</section>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand" id="brand">Cash Vouchers</div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main">
    <div id="banner" class="banner hidden"></div>
    <div id="view"></div>
  </main>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="printArea"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
